name: Validate release site

on:
  push:
    branches: ["release/**", "fix/release-privacy-*"]
  pull_request:
    branches: ["release/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]"
      - name: Verify privacy and local site links
        run: |
          python scripts/privacy_gate.py
          python -m pytest -q tests/test_release_site_contract.py
      - name: Archive release preview
        uses: actions/upload-artifact@v4
        with:
          name: release-site-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/
          if-no-files-found: error
