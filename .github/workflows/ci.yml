name: OS29 Core privacy and tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  privacy-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Tracked files, paths and secret scan
        run: python scripts/privacy_gate.py
      - name: Gitleaks if available
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks git --redact --exit-code 1 .
          else
            echo "gitleaks unavailable; Python regex privacy scanner completed"
          fi
      - name: Compile
        run: python -m compileall -q os29 integrations examples scripts tests
      - name: Test complete public suite
        run: python -m pytest -q
      - name: Offline smoke
        run: python scripts/offline_smoke.py
      - name: Whitespace check
        run: git diff --check
