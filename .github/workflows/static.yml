name: Deploy ANA MAX OS29 portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Stage only approved public portfolio pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp site/portfolio/index.html site/portfolio/live.html site/portfolio/cv.html site/portfolio/core.html site/portfolio/start-here.html site/portfolio/wow.html _site/
          mkdir -p _site/assets
          cp site/portfolio/assets/tower-original.png site/portfolio/assets/four-terminals.png _site/assets/
          test -s _site/wow.html
          test -s _site/start-here.html
      - name: Upload approved site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
