[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os29-lab"
version = "0.1.0"
description = "Local-first evidence, memory, diagnostics and work-unit continuity for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "mypy==2.4.1", "ruff==0.17.6"]

[project.scripts]
os29 = "os29.cli:main"
os29-gateway = "os29.gateway:main"

[tool.setuptools.packages.find]
include = ["os29*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["os29"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["psutil"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
