[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os29-lab"
version = "0.1.0"
description = "Local-first evidence, memory, diagnostics and work-unit continuity for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
os29 = "os29.cli:main"
os29-gateway = "os29.gateway:main"

[tool.setuptools.packages.find]
include = ["os29*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
